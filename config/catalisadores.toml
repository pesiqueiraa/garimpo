# Catalisadores brasileiros: mudanças que criam um "por que agora" para tropicalizar.
# O score cruza cada catalisador com os trilhos locais (rails) e as palavras-chave
# da extração. Atualize datas e descrições quando a regra mudar — isto é curadoria manual.

[[catalisador]]
id = "pix_automatico"
nome = "Pix Automático"
desde = "2025-06-16"
rails = ["payments"]
keywords = ["assinatura", "recorrente", "mensalidade", "subscription", "recurring", "débito automático", "direct debit", "billing"]
nota = "Cobrança recorrente via Pix com um único consentimento do pagador."
